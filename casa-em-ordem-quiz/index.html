<script>
(function(){
  const app = document.getElementById('app');

  let STEP = 0;
  const ANSWERS = {};

  // Timer Evergreen dinâmico atualizado automaticamente para o final do dia atual
  const CHECKOUT_BASE = 'https://pay.kiwify.com.br/JuDImie';

  // === UTM Persistence ===
  // Captura UTMs da URL atual e armazena em sessionStorage
  (function captureUTMs() {
    var params = new URLSearchParams(window.location.search);
    var utmKeys = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid','gclid'];
    utmKeys.forEach(function(key) {
      var val = params.get(key);
      if (val) sessionStorage.setItem('utm_' + key, val);
    });
    if (params.get('fbclid') && !sessionStorage.getItem('fbclid_ts')) sessionStorage.setItem('fbclid_ts', String(Date.now()));
  })();

  // Dados do navegador para a API de Conversões (o aviso da Kiwify não traz):
  // s1 = fbc, s2 = fbp, s3 = user agent. Voltam no webhook em TrackingParameters.
  function browserTrackingParts() {
    function cookie(name) {
      var m = document.cookie.match('(?:^|; )' + name + '=([^;]*)');
      return m ? decodeURIComponent(m[1]) : '';
    }
    var fbc = cookie('_fbc');
    var fbclid = sessionStorage.getItem('utm_fbclid');
    if (!fbc && fbclid) fbc = 'fb.1.' + (sessionStorage.getItem('fbclid_ts') || Date.now()) + '.' + fbclid;
    var vals = [['s1', fbc], ['s2', cookie('_fbp')], ['s3', navigator.userAgent]];
    return vals.filter(function(v) { return v[1]; }).map(function(v) { return v[0] + '=' + encodeURIComponent(v[1]); });
  }

  // Monta a URL de checkout com UTMs armazenados + s1/s2/s3
  function buildCheckoutURL() {
    var base = CHECKOUT_BASE;
    var utmKeys = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid','gclid'];
    var parts = [];
    utmKeys.forEach(function(key) {
      var val = sessionStorage.getItem('utm_' + key);
      if (val) parts.push(key + '=' + encodeURIComponent(val));
    });
    parts = parts.concat(browserTrackingParts());
    return parts.length > 0 ? base + '?' + parts.join('&') : base;
  }

  function setProgress(){
    // Mapeamento: só steps interativos contam no progresso
    const stepMap = {0:0, 2:1, 3:2, 5:3, 6:4, 9:5};
    const visualStep = stepMap[STEP] !== undefined ? stepMap[STEP] : 5;
    let pct = STEP >= 10 ? 100 : Math.round((visualStep/5)*100);
    progressFill.style.width = pct + '%';
  }

  function optHTML(emoji, label, action, value){
    return '<div class="opt" data-action="'+action+'" data-value="'+value+'"><span class="emoji">'+emoji+'</span><span>'+label+'</span></div>';
  }

  function render(){
    // Auto-skip slides informativos (removidos para aumentar conversão)
    if (STEP === 1 || STEP === 4 || STEP === 7 || STEP === 8) {
      STEP++;
      render();
      return;
    }
    setProgress();
    let html = '';
    switch(STEP){
      case 0:
        html = '<div style="text-align:center; margin-bottom:12px;"><span style="background:rgba(255,176,138,0.2); border:1px solid #ffb08a; color:#ffe3d1; padding:5px 14px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase;">🏷️ DIAGNÓSTICO GRATUITO · LEVA &lt; 2 MIN</span></div>'
        +'<div class="eyebrow" style="text-align:center; font-size:13px; margin-bottom:12px; letter-spacing:0.5px;">Descubra como deixar sua casa mais leve com apenas 15 minutos por dia</div>'
        +'<h1 class="q" style="text-align:center; font-size:23px; margin-bottom:16px;">Hoje, sua casa te traz mais paz ou mais peso?</h1>'
        +'<div style="text-align:center; font-size:13px; color:#ffb08a; font-weight:700; margin-bottom:14px;">👇 Toque em uma opção abaixo para iniciar:</div>'

        +optHTML('😔','Depende do dia, vivo tentando','q1','tentando')
        +optHTML('🤍','Mais paz, mas quero mais leveza','q1','paz')
        +'<div style="text-align:center; font-size:12px; color:rgba(255,255,255,0.6); margin-top:16px;">🔒 Resposta 100% anônima e gratuita · Ajudando famílias</div>';
        break;
      case 1:
        html = '<div class="eyebrow">Você não está sozinha nisso</div>'
        +'<h1 class="q">A maioria das mulheres sente exatamente isso</h1>'
        +'<div class="card"><div class="stat-row">'
        +'<div><div class="stat-num">78%</div><div class="stat-label">sentem que a casa nunca fica pronta</div></div>'
        +'<div><div class="stat-num">62%</div><div class="stat-label">sentem culpa quase todo dia</div></div>'

        +'<p class="body-txt">A boa notícia: isso não é falta de esforço. É falta de um sistema que caiba na sua rotina real.</p>'
        +'<div class="btn" data-action="next">Quero entender melhor</div>';
        break;
      case 2:
        html = '<div class="eyebrow">Pergunta 1 de 5</div>'
        +'<h1 class="q">Quem mais te ajuda na rotina da casa?</h1>'
        +optHTML('🙋‍♀️','Praticamente ninguém, sou só eu','q2','sozinha')

        break;

        html = '<div class="eyebrow">Pergunta 2 de 5</div>'
        +'<h1 class="q">O que mais pesa no seu dia a dia?</h1>'

        +optHTML('✅','Com certeza, já passou da hora','q6','certeza');
        break;
      case 10:
        html = '<div class="loader-wrap">'
        +'<h1 class="q" style="text-align:center">Preparando seu diagnóstico personalizado</h1>'
        +'<div class="bar-outer"><div class="bar-inner" id="loadBar"></div></div>'
        +'<p class="body-txt" style="text-align:center" id="loadLabel">Analisando suas respostas...</p>'

        break;
      case 11: {
        const perfilA = ANSWERS.perfil === 'A';
        const titulo = perfilA ? 'ROTINA CORRIDA — QUEM TRABALHA FORA' : 'CASA EM TEMPO INTEGRAL — QUEM FICA EM CASA';
        const plano = perfilA ? 'Plano A' : 'Plano B';

        +'<div class="card"><strong>O que o Casa em Ordem resolve pra você:</strong>'
        +'<p class="body-txt" style="margin:10px 0 0">◆ Uma rotina de limpeza que se mantém sozinha<br>◆ Cardápio e compras sem perder tempo pensando<br>◆ Fim da culpa por não dar conta de tudo</p></div>'
        +'<div class="btn" data-action="next">Ver minha solução</div>';
        break;
      }
      case 12:
        html = '<h1 class="q">Com a palavra, quem já organizou a casa:</h1>'
        +'<div class="testi-card">"Eu vivia exausta tentando dar conta de tudo sozinha. Com o método, em duas semanas minha casa já estava diferente e eu, mais leve." — <strong>Fernanda R.</strong></div>'

      case 13: {

        +'<a class="btn" href="'+buildCheckoutURL()+'" id="btn-checkout">Quero organizar minha casa →</a>'
        +'</div>'
        +'<div class="guarantee">🛡️ <div><strong>Garantia de 7 dias.</strong> Se não amar, devolvemos 100% do seu dinheiro, sem perguntas.</div></div>';
        break;
      }
    }
    app.innerHTML = html;
    if (STEP===10) {
      if (typeof fbq === 'function') { fbq('trackCustom', 'QuizStep_10'); }
      startLoading();
    }
    if (STEP===11) {
      // Lead: usuário completou o quiz e viu o resultado
      if(typeof fbq === 'function') {
        fbq('track', 'Lead', {
          content_name: 'Quiz Casa em Ordem',
          content_category: 'Quiz Resultado'
        });
      }
    }
    if (STEP===13) {
      if (typeof fbq === 'function') { fbq('trackCustom', 'QuizStep_13'); }
      setupCarousel();
      startCountdown();
    }
  }

  function startLoading(){
    let p = 0;
    const bar = document.getElementById('loadBar');
    const timer = setInterval(function(){
      p += Math.random()*18+8;
      if(p>=100){ p=100; clearInterval(timer); setTimeout(function(){ STEP=11; render(); }, 500); }
      bar.style.width = p+'%';
    }, 300);
  }

  function startCountdown(){
    function tick(){
      const now = new Date();
      // Evergreen timer: conta até a meia-noite do dia atual (23:59:59)
      const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
      let diff = midnight - now;
      if(diff < 0) diff = 0;
      const d = 0;
      const h = Math.floor((diff/(1000*60*60))%24);
      const m = Math.floor((diff/(1000*60))%60);
      const s = Math.floor((diff/1000)%60);
      const td=document.getElementById('td'), th=document.getElementById('th'), tm=document.getElementById('tm'), ts=document.getElementById('ts');
      if(td){ td.textContent=d; th.textContent=String(h).padStart(2,'0'); tm.textContent=String(m).padStart(2,'0'); ts.textContent=String(s).padStart(2,'0'); }
    }
    tick();
    setInterval(tick, 1000);
  }

  function setupCarousel(){
    const track = document.getElementById('materialsCarousel');
    const dotsWrap = document.getElementById('carouselDots');
    if(!track || !dotsWrap) return;
    const imgs = track.querySelectorAll('img');
    dotsWrap.innerHTML = '';
    imgs.forEach(function(_, i){
      const dot = document.createElement('span');
      dot.className = 'dot' + (i===0 ? ' active' : '');
      dot.addEventListener('click', function(){
        track.scrollTo({ left: track.clientWidth * i, behavior: 'smooth' });
      });
      dotsWrap.appendChild(dot);
    });
    track.addEventListener('scroll', function(){
      const idx = Math.round(track.scrollLeft / track.clientWidth);
      Array.prototype.forEach.call(dotsWrap.children, function(dot, i){
        dot.classList.toggle('active', i===idx);
      });
    });
    const prevBtn = document.getElementById('carouselPrev');
    const nextBtn = document.getElementById('carouselNext');
    function goTo(i){
      var clamped = Math.max(0, Math.min(imgs.length-1, i));
      track.scrollTo({ left: track.clientWidth * clamped, behavior: 'smooth' });
    }
    if(prevBtn){ prevBtn.addEventListener('click', function(){
      var idx = Math.round(track.scrollLeft / track.clientWidth);
      goTo(idx - 1);
    }); }
    if(nextBtn){ nextBtn.addEventListener('click', function(){
      var idx = Math.round(track.scrollLeft / track.clientWidth);
      goTo(idx + 1);
    }); }
  }

  app.addEventListener('click', function(e){
    const el = e.target.closest('[data-action], a.btn');
    if(!el) return;

    // Rastrear progresso do Quiz no Meta Pixel com eventos individuais
    if (typeof fbq === 'function') {
      fbq('trackCustom', 'QuizStep_' + STEP);
    }

    // InitiateCheckout: clique no botão de compra (link para Kiwify)
    if(el.tagName === 'A' && el.href && el.href.includes('kiwify')) {
      if(typeof fbq === 'function') {
        fbq('track', 'InitiateCheckout', {
          content_name: 'Casa em Ordem',
          value: 49.90,
          currency: 'BRL'
        });
      }
      return; // deixa o link navegar normalmente
    }
    const action = el.getAttribute('data-action');
    if(!action) return;
    if(action==='next'){ STEP++; render(); return; }
    const value = el.getAttribute('data-value');
    ANSWERS[action] = value;
    STEP++;
    render();
  });

  render();
})();
</script>
</body>
</html>
